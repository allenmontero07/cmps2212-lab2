<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Changer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      display: flex;
      justify-content: center;
      margin: 20px;
    }

    .box {
      width: 200px;
      height: 200px;
      background-color: lightgray;
      border: 2px solid black;
      margin: 10px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    button {
      margin: 5px;
      padding: 10px 15px;
    }
  </style>
</head>
<body>

  <h1 id="main-heading">Color Changer Lab</h1>

  <div class="container">
    <div class="box" id="box1">Box 1</div>
    <div class="box" id="box2">Box 2</div>
    <div class="box" id="box3">Box 3</div>
  </div>

  <div>
    <button id="btn-red">Make Red</button>
    <button id="btn-blue">Make Blue</button>
    <button id="btn-green">Make Green</button>
    <button id="reset-btn">Reset All</button>
  </div>

  <script defer>

    const boxes = document.querySelectorAll(".box");

    const redBtn = document.getElementById("btn-red");
    const blueBtn = document.getElementById("btn-blue");
    const greenBtn = document.getElementById("btn-green");
    const resetBtn = document.getElementById("reset-btn");

    if (boxes.length === 0) console.error("Boxes not found");

    if (!redBtn) console.error("Red button not found");
    if (!blueBtn) console.error("Blue button not found");
    if (!greenBtn) console.error("Green button not found");
    if (!resetBtn) console.error("Reset button not found");


    redBtn.addEventListener("click", () => {
      boxes.forEach(box => {
        box.style.backgroundColor = "red";
      });
    });

    blueBtn.addEventListener("click", () => {
      boxes.forEach(box => {
        box.style.backgroundColor = "blue";
      });
    });

    greenBtn.addEventListener("click", () => {
      boxes.forEach(box => {
        box.style.backgroundColor = "green";
      });
    });

    resetBtn.addEventListener("click", () => {
      boxes.forEach(box => {
        box.style.backgroundColor = "lightgray";
      });
    });

  </script>

</body>
</html>
